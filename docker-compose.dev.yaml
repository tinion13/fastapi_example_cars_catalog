services:
  db:
    image: postgres:16-alpine
    container_name: postgres_dev_cars_catalog
    environment:
      POSTGRES_DB: cars_catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cars_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    container_name: app_dev_cars_catalog
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
    depends_on:
      db:
        condition: service_healthy
    command: >
      uv run uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/src
    restart: unless-stopped

volumes:
  postgres_dev_data: